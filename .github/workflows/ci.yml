name: CloudForge and LogMind AI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cloudforge-test:
    name: Test CloudForge API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Run CloudForge tests
        run: python -m pytest app/tests -v

  logmind-test:
    name: Test LogMind AI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: logmind-ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: logmind-ai/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run LogMind AI tests
        run: python -m pytest tests -v

  cloudforge-docker-build:
    name: Build CloudForge Docker image
    runs-on: ubuntu-latest
    needs: cloudforge-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t cloudforge-api:${{ github.sha }} .
  logmind-docker-build:
    name: Build LogMind AI Docker image
    runs-on: ubuntu-latest
    needs: logmind-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t logmind-ai:${{ github.sha }} ./logmind-ai
  cloudforge-docker-publish:
    name: Publish CloudForge image to Docker Hub
    runs-on: ubuntu-latest
    needs: [cloudforge-test, cloudforge-docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: arunnamagiri
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push CloudForge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            arunnamagiri/cloudforge-api:latest
            arunnamagiri/cloudforge-api:${{ github.sha }}

  logmind-docker-publish:
    name: Publish LogMind AI image to Docker Hub
    runs-on: ubuntu-latest
    needs: [logmind-test, logmind-docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: arunnamagiri
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push LogMind AI image
        uses: docker/build-push-action@v6
        with:
          context: ./logmind-ai
          file: ./logmind-ai/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            arunnamagiri/logmind-ai:latest
            arunnamagiri/logmind-ai:${{ github.sha }}