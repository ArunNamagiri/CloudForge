apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge-api
  labels:
    app: cloudforge-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloudforge-api
  template:
    metadata:
      labels:
        app: cloudforge-api
    spec:
      containers:
        - name: cloudforge-api
          image: arunnamagiri/cloudforge-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15